<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — Musafir Cafe</title>
<meta name="theme-color" content="#6E1F2B">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#FBF3E7; color:#2B211B;
        font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; text-align:center; padding:24px; }
  .card{ max-width:360px; }
  img{ width:96px; height:96px; border-radius:22px; }
  h1{ color:#6E1F2B; font-size:1.5rem; margin:18px 0 8px; }
  p{ line-height:1.6; color:#5C4E43; }
  button{ margin-top:16px; background:#6E1F2B; color:#fff; border:none; border-radius:999px; padding:14px 28px; font-size:1rem; font-weight:600; min-height:48px; }
</style>
</head>
<body>
  <div class="card">
    <img src="icons/icon-192.png" alt="Musafir Cafe">
    <h1>You're offline</h1>
    <p>We can't reach the internet right now. Please check your connection and try again — your cart is saved on this phone.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
